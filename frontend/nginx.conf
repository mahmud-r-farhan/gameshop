# Static SPA config for the frontend container (frontend/Dockerfile).
# The public reverse proxy config lives in nginx/prod.conf.template.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # nginx does not inherit add_header into a location that sets its own,
        # so the security headers are repeated in each location block.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # SPA fallback. index.html must never be cached: a cached shell keeps
        # pointing at hashed assets from a previous deploy.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri /index.html;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
