name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**', 'admin/**']
  pull_request:
    branches: [main, develop]
    paths: ['frontend/**', 'admin/**']

env:
  NODE_VERSION: '18'

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

  admin:
    name: Admin Panel (Vue 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: cd admin && npm run lint

      - name: Build
        run: cd admin && npm run build
