version: '3.8'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gameshop_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-gameshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gameshop_dev}
      POSTGRES_DB: ${DB_NAME:-gameshop_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gameshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameshop_network
    restart: unless-stopped

  # ─── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gameshop_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-gameshop_redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gameshop_network
    restart: unless-stopped

  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: gameshop_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-gameshop}:${DB_PASSWORD:-gameshop_dev}@postgres:5432/${DB_NAME:-gameshop_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-gameshop_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5174}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - backend_logs:/var/log/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gameshop_network
    restart: unless-stopped

  # ─── Frontend (React) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: gameshop_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gameshop_network
    restart: unless-stopped

  # ─── Admin Panel (Vue 3) ──────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: production
    container_name: gameshop_admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - gameshop_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  gameshop_network:
    driver: bridge
